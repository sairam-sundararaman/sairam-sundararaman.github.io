    <!--
      GitHub Pages SPA redirect (single-page-apps for github pages, MIT, rafgraph).
      Pairs with public/404.html. Decodes a path that was redirected through
      404.html back into a real history entry, so /cv and /about work as
      normal-looking URLs on GitHub Pages instead of only working via a hash.
      Safe no-op on any other host.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
